[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aachat-messenger"
version = "0.1.0"
description = "Local runner CLI for the aachat messenger agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reply-drafter = "messenger_local_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
